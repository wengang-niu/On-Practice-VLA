[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "on-practice-vla"
version = "0.1.0"
description = "Practical VLA experiments and training scripts"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "torchaudio==2.7.1",
  "lerobot",
  "datasets",
  "transformers",
  "accelerate",
  "tqdm",
  "numpy",
  "opencv-python",
]

[tool.setuptools]
packages = []

[tool.uv]
index-url = "https://download.pytorch.org/whl/cu118"
